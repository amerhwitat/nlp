name: AVRS build validation
on:
  push:
    paths: ['AncientVisualResearchSuite/**']
  pull_request:
    paths: ['AncientVisualResearchSuite/**']
jobs:
  native-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AncientVisualResearchSuite
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m compileall -q ai/python core/python computer_vision/python
      - name: CMake build
        run: cmake -S gpu -B build/ci -DCMAKE_BUILD_TYPE=Release && cmake --build build/ci --parallel
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AncientVisualResearchSuite/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AncientVisualResearchSuite/web/package-lock.json
      - run: npm ci
      - run: npm run build
