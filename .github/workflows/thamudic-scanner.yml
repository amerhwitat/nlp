name: Thamudic Scanner

on:
  push:
    paths:
      - 'ThamudicScan/**'
      - 'python/thamudic/**'
      - '.github/workflows/thamudic-scanner.yml'
  pull_request:
    paths:
      - 'ThamudicScan/**'
      - 'python/thamudic/**'
      - '.github/workflows/thamudic-scanner.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ThamudicScan/server/requirements.txt
      - run: pytest ThamudicScan/server/tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ThamudicScan/web_ui/package.json
      - working-directory: ThamudicScan/web_ui
        run: npm install
      - working-directory: ThamudicScan/web_ui
        run: npm test -- --run
      - working-directory: ThamudicScan/web_ui
        run: npm run build
