name: Node ancient artifact database

on:
  push:
    paths:
      - 'nodejs/artifacts/**'
      - '.github/workflows/node-artifacts.yml'
  pull_request:
    paths:
      - 'nodejs/artifacts/**'
      - '.github/workflows/node-artifacts.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check nodejs/artifacts/server.js
      - run: node --check nodejs/artifacts/web/app.js
      - run: npm install --ignore-scripts
        working-directory: nodejs/artifacts
