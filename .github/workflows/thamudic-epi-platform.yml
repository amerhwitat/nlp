name: Thamudic Epi Platform

on:
  push:
    paths:
      - 'ThamudicEpiPlatform/**'
      - '.github/workflows/thamudic-epi-platform.yml'
  pull_request:
    paths:
      - 'ThamudicEpiPlatform/**'
      - '.github/workflows/thamudic-epi-platform.yml'

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ThamudicEpiPlatform/server/requirements.txt
      - run: PYTHONPATH=. pytest ThamudicEpiPlatform/server/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ThamudicEpiPlatform/web/package.json
      - working-directory: ThamudicEpiPlatform/web
        run: npm install
      - working-directory: ThamudicEpiPlatform/web
        run: npm run build
