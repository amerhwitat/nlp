name: Thamudic Epi Platform

on:
  push:
    paths:
      - 'ThamudicEpiPlatform/**'
      - '.github/workflows/thamudic-epi-platform.yml'
  pull_request:
    paths:
      - 'ThamudicEpiPlatform/**'
      - '.github/workflows/thamudic-epi-platform.yml'

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ThamudicEpiPlatform/server/requirements.txt
      - run: PYTHONPATH=. pytest ThamudicEpiPlatform/server/tests -q

  schema-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          root=Path('ThamudicEpiPlatform')
          con=sqlite3.connect(':memory:')
          con.executescript((root/'database/schema.sql').read_text())
          con.executescript((root/'database/views.sql').read_text())
          for name in ['002_pdf_translation_kpi.sql','003_ocr_jobs.sql','004_orientation_translation_chat.sql']:
              con.executescript((root/'database/migrations'/name).read_text())
          print('SQLite schema/migrations: OK')
          PY

  cross-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev cmake
      - working-directory: ThamudicEpiPlatform
        run: ./scripts/check-dependencies.sh
      - working-directory: ThamudicEpiPlatform
        run: STRICT_TOOLCHAINS=1 ./scripts/build-all-languages.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: ThamudicEpiPlatform/web
        run: npm install
      - working-directory: ThamudicEpiPlatform/web
        run: npm run build
