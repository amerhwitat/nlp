name: Java AI Discipline Pipeline
on:
  push:
    paths: ["java/ai-disciplines/**", ".github/workflows/java-ai-disciplines.yml"]
  pull_request:
    paths: ["java/ai-disciplines/**", ".github/workflows/java-ai-disciplines.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: java/ai-disciplines/pom.xml
      - run: mvn -f java/ai-disciplines/pom.xml --batch-mode test
      - run: mvn -f java/ai-disciplines/pom.xml --batch-mode package
