name: Python database tests

on:
  push:
    paths:
      - 'ancient_objects_db.py'
      - 'database_cli.py'
      - 'historical_periods.py'
      - 'tests/**'
      - '.github/workflows/python-database-tests.yml'
  pull_request:
    paths:
      - 'ancient_objects_db.py'
      - 'database_cli.py'
      - 'historical_periods.py'
      - 'tests/**'
      - '.github/workflows/python-database-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m py_compile ancient_objects_db.py database_cli.py
      - run: PYTHONPATH=. pytest -q tests/test_ancient_objects_db.py
