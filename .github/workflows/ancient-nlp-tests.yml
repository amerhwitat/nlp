name: Ancient NLP translation and provenance tests

on:
  push:
    paths:
      - 'python/thamudic/**'
      - 'python/tests/**'
      - 'ThamudicScan/server/**'
      - '.github/workflows/ancient-nlp-tests.yml'
  pull_request:
    paths:
      - 'python/thamudic/**'
      - 'python/tests/**'
      - 'ThamudicScan/server/**'
      - '.github/workflows/ancient-nlp-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m py_compile python/thamudic/*.py
      - run: PYTHONPATH=. pytest -q python/tests
