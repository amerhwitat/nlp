name: All-in-One Scanner Smoke Tests

on:
  push:
    paths:
      - 'run_thamudic002.py'
      - 'python/thamudic/resilient_ocr.py'
      - 'python/ThamudicScanner_AllInOne.py'
      - 'python/NLPScanner_AllInOne.py'
      - 'python/thamudic_all_in_one.py'
      - '.github/workflows/all-in-one-scanners.yml'
  pull_request:
    paths:
      - 'run_thamudic002.py'
      - 'python/thamudic/resilient_ocr.py'
      - 'python/ThamudicScanner_AllInOne.py'
      - 'python/NLPScanner_AllInOne.py'
      - 'python/thamudic_all_in_one.py'
      - '.github/workflows/all-in-one-scanners.yml'

jobs:
  syntax-and-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile scanner applications
        run: python -m py_compile run_thamudic002.py python/thamudic/resilient_ocr.py python/ThamudicScanner_AllInOne.py python/NLPScanner_AllInOne.py python/thamudic_all_in_one.py
      - name: Check CLI help
        run: |
          python run_thamudic002.py --help
          python python/ThamudicScanner_AllInOne.py --help
          python python/NLPScanner_AllInOne.py --help
      - name: Check offline text scanning
        run: |
          python python/ThamudicScanner_AllInOne.py --text 'test' --scan
          python python/NLPScanner_AllInOne.py --text 'test' --scan
