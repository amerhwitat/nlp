name: ISO-Tool verification
on:
  push:
    paths: ['ISO-Tool/**']
  pull_request:
    paths: ['ISO-Tool/**']
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Python implementation
        working-directory: ISO-Tool/python
        run: python -m unittest discover -s tests -v
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Build .NET 6 desktop
        run: dotnet build ISO-Tool/dotnet/ISO-Tool/ISO-Tool.csproj -c Release -f net6.0-windows
      - name: Verify MSVC project metadata
        shell: pwsh
        run: |
          if (-not (Test-Path 'ISO-Tool/vcpp/ISO-Tool.sln')) { throw 'VC++ solution missing' }
          if (-not (Test-Path 'ISO-Tool/vcpp/ISO-Tool.vcxproj')) { throw 'VC++ project missing' }
