name: NLPApple
options:
  bundleIdPrefix: com.amerhwitat
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
targets:
  NLPApple:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amerhwitat.nlp
        GENERATE_INFOPLIST_FILE: YES
  NLPMac:
    type: application
    platform: macOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amerhwitat.nlp.mac
        GENERATE_INFOPLIST_FILE: YES
