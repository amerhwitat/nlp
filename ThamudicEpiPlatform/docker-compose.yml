services:
  api:
    build: .
    ports: ["8010:8010"]
    environment:
      CORS_ORIGINS: http://localhost:5173
    volumes: ["./data:/app/data"]
  web:
    image: node:22-alpine
    working_dir: /app/web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    volumes: ["./web:/app/web"]
    depends_on: [api]
