services:
  nlp-studio:
    build:
      context: ..
      dockerfile: nlp-studio/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Optional remote translation provider hook (disabled when blank).
      ANCIENT_TRANSLATION_API_KEY: ${ANCIENT_TRANSLATION_API_KEY:-}
      ANCIENT_TRANSLATION_API_URL: ${ANCIENT_TRANSLATION_API_URL:-}
      ANCIENT_TRANSLATION_MODEL: ${ANCIENT_TRANSLATION_MODEL:-}
      NLP_STUDIO_MAX_UPLOAD_BYTES: ${NLP_STUDIO_MAX_UPLOAD_BYTES:-10485760}
    volumes:
      - studio-data:/app/nlp-studio/data
    restart: unless-stopped

volumes:
  studio-data:
