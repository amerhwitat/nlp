<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ancient Language NLP Workbench</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:1000px;margin:auto;padding:2rem}
    textarea{width:100%;box-sizing:border-box;margin:.4rem 0 1rem;padding:.7rem;font-size:1.1rem}
    .voice-controls{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:-.6rem 0 1rem}
    .voice-controls label{font-size:.9rem}
    .voice-controls input,.voice-controls select{max-width:150px}
    button{padding:.45rem .8rem;cursor:pointer}
    [dir="rtl"]{text-align:right}
    .status{font-size:.85rem;opacity:.8}
  </style>
</head>
<body>
<main>
  <h1>Ancient Language NLP Workbench</h1>
  <label for="input">Source text / transliteration</label>
  <textarea id="input" rows="6" placeholder="Enter ancient text or transliteration"></textarea>

  <label for="transliteration">Scholarly transliteration</label>
  <textarea id="transliteration" rows="5" dir="auto" placeholder="Transliteration"></textarea>
  <div class="voice-controls" data-voice-target="transliteration">
    <button data-action="play">▶ Listen</button><button data-action="pause">⏸ Pause</button><button data-action="resume">▶ Resume</button><button data-action="stop">■ Stop</button><button data-action="replay">↻ Replay</button>
    <label>Voice <select data-control="voice"></select></label>
    <label>Locale <input data-control="lang" value="en-US"></label>
    <label>Rate <input data-control="rate" type="number" min="0.1" max="3" step="0.1" value="1"></label>
    <label>Pitch <input data-control="pitch" type="number" min="0" max="2" step="0.1" value="1"></label>
    <label>Volume <input data-control="volume" type="number" min="0" max="1" step="0.1" value="1"></label>
    <label>Mode <select data-control="mode"><option value="modern">Modern/reference</option><option value="reconstructed">Reconstructed</option><option value="scholarly">Scholarly</option></select></label>
    <span class="status" data-status>Speech status: detecting…</span>
  </div>

  <label for="translation">Target-language translation</label>
  <textarea id="translation" rows="5" dir="auto" placeholder="Translation"></textarea>
  <div class="voice-controls" data-voice-target="translation">
    <button data-action="play">▶ Listen</button><button data-action="pause">⏸ Pause</button><button data-action="resume">▶ Resume</button><button data-action="stop">■ Stop</button><button data-action="replay">↻ Replay</button>
    <label>Voice <select data-control="voice"></select></label>
    <label>Locale <input data-control="lang" value="en-US"></label>
    <label>Rate <input data-control="rate" type="number" min="0.1" max="3" step="0.1" value="1"></label>
    <label>Pitch <input data-control="pitch" type="number" min="0" max="2" step="0.1" value="1"></label>
    <label>Volume <input data-control="volume" type="number" min="0" max="1" step="0.1" value="1"></label>
    <label>Mode <select data-control="mode"><option value="modern">Modern/reference</option><option value="reconstructed">Reconstructed</option><option value="scholarly">Scholarly</option></select></label>
    <span class="status" data-status>Speech status: detecting…</span>
  </div>

  <pre id="out"></pre>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
